name: Build and Push Docker Images

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: docker.io

jobs:
  # 1. Evaluate which paths changed
  detect-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      workflow: ${{ steps.filter.outputs.workflow }}
      mediamtx: ${{ steps.filter.outputs.mediamtx }}
      nextjs: ${{ steps.filter.outputs.nextjs }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect Changed Files
        uses: dorny/paths-filter@v4
        id: filter
        with:
          # A file must match every pattern of a filter, so the "!" exclusions actually apply
          predicate-quantifier: 'every'
          filters: |
            workflow:
              - '.github/workflows/docker-build.yml'
            mediamtx:
              - 'mediamtx/**'
              - '!mediamtx/paths.yml.example'
            nextjs:
              - 'nextjs/**'

  # 2. Build backend
  build-discordmtx:
    needs: detect-changes
    # Run if backend files or this workflow changed, OR if it's a tag, OR if manually dispatched
    if: |
      needs.detect-changes.outputs.mediamtx == 'true' ||
      needs.detect-changes.outputs.workflow == 'true' || 
      github.event_name == 'workflow_dispatch' || 
      startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ vars.DOCKERHUB_USERNAME }}/discordmtx
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./mediamtx
          file: ./mediamtx/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 3. Build frontend
  build-nextjs:
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.nextjs == 'true' ||
      needs.detect-changes.outputs.workflow == 'true' || 
      github.event_name == 'workflow_dispatch' || 
      startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ vars.DOCKERHUB_USERNAME }}/discordmtx-nextjs
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./nextjs
          file: ./nextjs/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max