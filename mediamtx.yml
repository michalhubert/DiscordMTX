api: true
apiAddress: :9997
apiTrustedProxies:
  - 0.0.0.0/0
  - ::/0

authMethod: internal

authInternalUsers:
  # The only user, so nothing is reachable anonymously. Its password and
  # permissions are set by entrypoint.sh.
  - user: streamer
    permissions:
      - action: api
      - action: metrics

# Only WebRTC is used (WHIP publishing, WHEP playback through Next.js).
rtsp: false
rtmp: false
hls: false
srt: false
moq: false

webrtc: true
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189
webrtcTrustedProxies:
  - 0.0.0.0/0
  - ::/0

webrtcIPsFromInterfaces: true
