authMethod: internal

authInternalUsers:
  # Owner. Publish permissions are added dynamically per path by entrypoint.sh
  # via MTX_AUTHINTERNALUSERS_0_PERMISSIONS_* environment variables.
  - user: streamer
    permissions: []

  # Frens (through nginx, or directly when nginx is not used). Read permissions
  # are added dynamically per path by entrypoint.sh via
  # MTX_AUTHINTERNALUSERS_1_PERMISSIONS_* environment variables.
  - user: any
    permissions: []

  # API local only
  - user: any
    ips:
      - 127.0.0.1
      - ::1
    permissions:
      - action: api
      - action: metrics
      - action: pprof

webrtc: true
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189

webrtcIPsFromInterfaces: true
