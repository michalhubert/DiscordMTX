<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DiscordMTX - Streamer HUD</title>
  <style>
    :root {
      --bg: #121216;
      --card-bg: #1b1b22;
      --border: #2c2c38;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --green: #22c55e;
      --red: #ef4444;
      --yellow: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 13px;
      line-height: 1.4;
      padding: 12px;
      user-select: none;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.5px;
    }

    .badge-status {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 9999px;
      background: #1f2937;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .badge-status.live {
      background: rgba(34, 197, 94, 0.15);
      color: var(--green);
    }

    .badge-status.live .dot {
      background-color: var(--green);
      box-shadow: 0 0 6px var(--green);
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--text-muted);
    }

    .controls {
      display: flex;
      gap: 6px;
    }

    button {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
    }

    button:hover {
      background: var(--border);
      color: var(--text);
    }

    button.active {
      background: rgba(99, 102, 241, 0.2);
      border-color: var(--accent);
      color: var(--accent);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
    }

    .stat-label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .stat-value {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
    }

    .stat-value.green {
      color: var(--green);
    }

    .section-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 12px 0 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .viewer-list, .event-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 220px;
      overflow-y: auto;
    }

    .viewer-item, .event-item {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
    }

    .viewer-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .ip-address {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 600;
      color: #38bdf8;
    }

    .meta-tag {
      font-size: 10px;
      color: var(--text-muted);
    }

    .viewer-stats {
      text-align: right;
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .empty-state {
      padding: 16px;
      text-align: center;
      color: var(--text-muted);
      font-style: italic;
      background: rgba(27, 27, 34, 0.5);
      border-radius: 6px;
      border: 1px dashed var(--border);
    }

    .event-item {
      font-size: 11px;
      padding: 6px 10px;
    }

    .event-time {
      font-family: monospace;
      color: var(--text-muted);
      font-size: 10px;
    }

    .event-badge {
      font-size: 10px;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 4px;
    }

    .event-badge.join {
      background: rgba(34, 197, 94, 0.2);
      color: var(--green);
    }

    .event-badge.leave {
      background: rgba(239, 68, 68, 0.2);
      color: var(--red);
    }

    /* Scrollbars */
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 2px;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="brand">
      <span>DiscordMTX</span>
      <div id="stream-status" class="badge-status">
        <span class="dot"></span>
        <span id="status-text">Checking</span>
      </div>
    </div>
    <div class="controls">
      <button id="sound-btn" title="Toggle audio chime on viewer join" onclick="toggleSound()">
        <span id="sound-icon">🔔</span> <span id="sound-label">Sound On</span>
      </button>
      <button onclick="refreshData(true)" title="Force Refresh">🔄</button>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">Active Viewers</div>
      <div id="viewer-count" class="stat-value green">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Active Streams</div>
      <div id="path-count" class="stat-value">0</div>
    </div>
  </div>

  <div class="section-title">
    <span>Current Viewers</span>
    <span id="live-indicator" style="font-size: 10px; opacity: 0.7;">polling</span>
  </div>
  <ul id="viewers-list" class="viewer-list">
    <li class="empty-state">No viewers connected</li>
  </ul>

  <div class="section-title">
    <span>Recent Activity</span>
    <span style="font-size: 10px; cursor: pointer; text-decoration: underline;" onclick="clearEvents()">Clear</span>
  </div>
  <ul id="events-list" class="event-list">
    <li class="empty-state">No recent activity</li>
  </ul>

  <script>
    let soundEnabled = true;
    let knownSessionIds = new Set();
    let initialLoad = true;
    let eventHistory = [];
    const MAX_EVENTS = 20;

    // Web Audio Synthesized Chime (no external files needed)
    let audioCtx = null;
    function playChime(isJoin = true) {
      if (!soundEnabled) return;
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        if (isJoin) {
          osc.frequency.setValueAtTime(587.33, now); // D5
          osc.frequency.setValueAtTime(880, now + 0.1); // A5
        } else {
          osc.frequency.setValueAtTime(880, now);
          osc.frequency.setValueAtTime(587.33, now + 0.1);
        }

        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now);
        osc.stop(now + 0.35);
      } catch (e) {
        console.error("Audio chime error:", e);
      }
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      const btn = document.getElementById('sound-btn');
      const icon = document.getElementById('sound-icon');
      const label = document.getElementById('sound-label');

      if (soundEnabled) {
        btn.classList.remove('active');
        icon.innerText = '🔔';
        label.innerText = 'Sound On';
        playChime(true);
      } else {
        btn.classList.add('active');
        icon.innerText = '🔕';
        label.innerText = 'Muted';
      }
    }

    function formatBytes(bytes) {
      if (!bytes || bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    function formatDuration(startTime) {
      if (!startTime) return '0s';
      const start = new Date(startTime).getTime();
      const now = Date.now();
      const diffSec = Math.max(0, Math.floor((now - start) / 1000));
      if (diffSec < 60) return `${diffSec}s`;
      const mins = Math.floor(diffSec / 60);
      const secs = diffSec % 60;
      if (mins < 60) return `${mins}m ${secs}s`;
      const hrs = Math.floor(mins / 60);
      return `${hrs}h ${mins % 60}m`;
    }

    function logEvent(type, text, ip) {
      const now = new Date();
      const timeStr = now.toTimeString().split(' ')[0];
      eventHistory.unshift({ type, text, ip, time: timeStr });
      if (eventHistory.length > MAX_EVENTS) {
        eventHistory.pop();
      }
      renderEvents();
    }

    function clearEvents() {
      eventHistory = [];
      renderEvents();
    }

    function renderEvents() {
      const el = document.getElementById('events-list');
      if (eventHistory.length === 0) {
        el.innerHTML = '<li class="empty-state">No recent activity</li>';
        return;
      }
      el.innerHTML = eventHistory.map(e => `
        <li class="event-item">
          <div style="display: flex; align-items: center; gap: 6px;">
            <span class="event-badge ${e.type}">${e.type === 'join' ? 'JOIN' : 'LEAVE'}</span>
            <span style="font-family: monospace;">${e.ip}</span>
            <span style="color: var(--text-muted); font-size: 10px;">${e.text}</span>
          </div>
          <span class="event-time">${e.time}</span>
        </li>
      `).join('');
    }

    function cleanRemoteAddr(addr) {
      if (!addr) return 'unknown';
      if (addr.startsWith('[')) {
        const end = addr.indexOf(']');
        return end !== -1 ? addr.slice(1, end) : addr;
      }
      const lastColon = addr.lastIndexOf(':');
      return lastColon !== -1 ? addr.slice(0, lastColon) : addr;
    }

    function getApiUrl(endpoint) {
      // Avoid 'TypeError: Window.fetch ... is an url with embedded credentials'
      // when page is accessed via http(s)://user:pass@host/...
      const origin = (window.location.origin && window.location.origin !== 'null')
        ? window.location.origin
        : `${window.location.protocol}//${window.location.host}`;
      return `${origin}${endpoint}`;
    }

    async function refreshData() {
      try {
        const [sessionsRes, pathsRes] = await Promise.allSettled([
          fetch(getApiUrl('/streamer/api/webrtcsessions/list')),
          fetch(getApiUrl('/streamer/api/paths/list'))
        ]);

        let sessions = [];
        let paths = [];
        let hasAuthError = false;
        let hasApiError = false;

        if (sessionsRes.status === 'fulfilled') {
          if (sessionsRes.value.ok) {
            const sData = await sessionsRes.value.json();
            sessions = sData.items || [];
          } else if (sessionsRes.value.status === 401 || sessionsRes.value.status === 403) {
            hasAuthError = true;
            console.warn('webrtcsessions auth error:', sessionsRes.value.status);
          } else {
            console.warn('webrtcsessions error:', sessionsRes.value.status);
            hasApiError = true;
          }
        } else {
          console.error('webrtcsessions request failed:', sessionsRes.reason);
          hasApiError = true;
        }

        if (pathsRes.status === 'fulfilled') {
          if (pathsRes.value.ok) {
            const pData = await pathsRes.value.json();
            paths = pData.items || [];
          } else if (pathsRes.value.status === 401 || pathsRes.value.status === 403) {
            hasAuthError = true;
            console.warn('paths auth error:', pathsRes.value.status);
          } else {
            console.warn('paths error:', pathsRes.value.status);
            hasApiError = true;
          }
        } else {
          console.error('paths request failed:', pathsRes.reason);
          hasApiError = true;
        }

        // Filter readers only (exclude WHIP publishers)
        const readers = sessions.filter(s => s.state === 'read' || (s.state !== 'publish' && s.state !== undefined));
        const activePublishers = paths.filter(p => p.ready);

        // Update Header Status
        const statusEl = document.getElementById('stream-status');
        const statusText = document.getElementById('status-text');

        if (hasAuthError) {
          statusEl.className = 'badge-status';
          statusText.innerText = 'AUTH ERROR';
        } else if (hasApiError && paths.length === 0 && sessions.length === 0) {
          statusEl.className = 'badge-status';
          statusText.innerText = 'API ERROR';
        } else if (activePublishers.length > 0) {
          statusEl.className = 'badge-status live';
          statusText.innerText = 'LIVE';
        } else {
          statusEl.className = 'badge-status';
          statusText.innerText = 'OFFLINE';
        }

        // Calculate active viewer count (max of WebRTC readers and total path readers)
        const totalPathReaders = paths.reduce((acc, p) => acc + (p.readers ? p.readers.length : 0), 0);
        const displayCount = Math.max(readers.length, totalPathReaders);

        document.getElementById('viewer-count').innerText = displayCount;
        document.getElementById('path-count').innerText = activePublishers.length > 0 ? activePublishers.length : paths.length;

        // Check for join / leave events
        const currentSessionIds = new Set(readers.map(r => r.id));

        if (!initialLoad && !hasAuthError) {
          // Check joins
          for (const reader of readers) {
            if (!knownSessionIds.has(reader.id)) {
              const ip = cleanRemoteAddr(reader.remoteAddr);
              logEvent('join', `joined /${reader.path || 'stream'}`, ip);
              playChime(true);
            }
          }
          // Check leaves
          for (const oldId of knownSessionIds) {
            if (!currentSessionIds.has(oldId)) {
              logEvent('leave', 'disconnected', 'viewer');
              playChime(false);
            }
          }
        }
        knownSessionIds = currentSessionIds;
        initialLoad = false;

        // Render Active Viewers
        const viewersList = document.getElementById('viewers-list');
        if (readers.length === 0) {
          viewersList.innerHTML = '<li class="empty-state">No viewers connected</li>';
        } else {
          viewersList.innerHTML = readers.map(r => {
            const cleanIp = cleanRemoteAddr(r.remoteAddr);
            return `
              <li class="viewer-item">
                <div class="viewer-info">
                  <span class="ip-address">${cleanIp}</span>
                  <span class="meta-tag">Path: <strong>${r.path || 'default'}</strong></span>
                </div>
                <div class="viewer-stats">
                  <span>⏱ ${formatDuration(r.created)}</span>
                  <span>📦 ${formatBytes(r.bytesSent)}</span>
                </div>
              </li>
            `;
          }).join('');
        }

      } catch (err) {
        console.error("Error updating streamer HUD:", err);
        const statusEl = document.getElementById('stream-status');
        const statusText = document.getElementById('status-text');
        statusEl.className = 'badge-status';
        statusText.innerText = 'API ERROR';
      }
    }

    setInterval(refreshData, 2000);
    refreshData();
  </script>
</body>
</html>
