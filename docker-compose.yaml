services:
  discordmtx:
    image: mikko99/discordmtx:latest
    container_name: discordmtx
    restart: unless-stopped

    user: "1200:1200" # Change to any user that has access to volume files or remove to run as root

    environment:
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      # Optional per-path webhook overrides, e.g. "desktop:https://discord.com/...,gaming:https://discord.com/..."
      DISCORD_WEBHOOK_URLS: ${DISCORD_WEBHOOK_URLS:-}
      PLAYER_DOMAIN: ${PLAYER_DOMAIN:-}
      STREAMER_PASSWORD: ${STREAMER_PASSWORD:-}
      API_TRUSTED_PROXIES: ${API_TRUSTED_PROXIES:-0.0.0.0/0,::/0}
      WEBRTC_TRUSTED_PROXIES: ${WEBRTC_TRUSTED_PROXIES:-0.0.0.0/0,::/0}
      WEBRTC_ADDITIONAL_HOSTS: ${WEBRTC_ADDITIONAL_HOSTS:-0.0.0.0,rtc.domain.com}
      # you can overwrite built in script using these env variables and proper volume containing new scripts
      HOOK_ONLINE: ${HOOK_ONLINE:-/hooks/stream-online.sh}
      HOOK_ONLINE_RESTART: ${HOOK_ONLINE_RESTART:-false}
      HOOK_OFFLINE: ${HOOK_OFFLINE:-/hooks/stream-offline.sh}

    volumes:
      - ./hooks:/opt/hooks:ro # custom hooks if needed
      - ./auth:/auth # place to store .htpasswd, MUST BE THE SAME LOCATION FOR NGINX
      - ./paths.yml:/opt/streams/paths.yml:ro # path configuration

    ports:
      - "8889:8889/tcp" # TCP comm, like WHIP or web player
      - "8189:8189/udp" # av stream goes through UDP

    networks:
      - stream

  nginx:
    image: mikko99/discordmtx-nginx:latest
    container_name: discordmtx-nginx
    restart: unless-stopped

    environment:
      # Hostname or IP of the discordmtx container/service NGINX proxies to (port and protocol stay fixed)
      STREAM_UPSTREAM_HOST: ${STREAM_UPSTREAM_HOST:-discordmtx}

    volumes:
      - ./auth:/auth:ro

    ports:
      - "${NGINX_PORT:-8080}:80"

    depends_on:
      - discordmtx

    networks:
      - stream

networks:
  stream:
