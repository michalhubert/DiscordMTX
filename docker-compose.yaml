services:
  discordmtx:
    image: mikko99/discordmtx:latest
    container_name: discordmtx
    restart: unless-stopped

    user: "1200:1200" # Change to any user that has access to volume files or remove to run as root

    environment:
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      # Optional per-path webhook overrides, e.g. "desktop:https://discord.com/...,gaming:https://discord.com/..."
      DISCORD_WEBHOOK_URLS: ${DISCORD_WEBHOOK_URLS:-}
      PLAYER_DOMAIN: ${PLAYER_DOMAIN:-}
      STREAMER_PASSWORD: ${STREAMER_PASSWORD:-}
      API_TRUSTED_PROXIES: ${API_TRUSTED_PROXIES:-0.0.0.0/0,::/0}
      WEBRTC_TRUSTED_PROXIES: ${WEBRTC_TRUSTED_PROXIES:-0.0.0.0/0,::/0}
      WEBRTC_ADDITIONAL_HOSTS: ${WEBRTC_ADDITIONAL_HOSTS:-0.0.0.0,rtc.domain.com}
      # you can overwrite built in script using these env variables and proper volume containing new scripts
      HOOK_ONLINE: ${HOOK_ONLINE:-/hooks/stream-online.sh}
      HOOK_ONLINE_RESTART: ${HOOK_ONLINE_RESTART:-false}
      HOOK_OFFLINE: ${HOOK_OFFLINE:-/hooks/stream-offline.sh}

    volumes:
      - ./hooks:/opt/hooks:ro # custom hooks if needed
      - ./auth:/auth # shared with nextjs for viewer-token
      - ./paths.yml:/opt/streams/paths.yml:ro # path configuration

    ports:
      # 8889 is exposed so OBS (running on the streamer's own machine, not
      # inside this Docker network) can reach MediaMTX directly for WHIP
      # publishing. Next.js still proxies WHEP internally for viewers.
      - "8889:8889" # WebRTC WHIP publish (OBS) / WHEP signaling
      - "8189:8189/udp" # RTP media goes direct browser ↔ MediaMTX over UDP

    networks:
      - stream

  nextjs:
    image: mikko99/discordmtx-nextjs:latest
    container_name: discordmtx-nextjs
    restart: unless-stopped

    environment:
      MEDIAMTX_HOST: ${MEDIAMTX_HOST:-discordmtx}
      MEDIAMTX_PORT: ${MEDIAMTX_PORT:-8889}
      MEDIAMTX_API_PORT: ${MEDIAMTX_API_PORT:-9997}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-changeme-use-a-random-secret}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-}
      # Streamer password, also used by MediaMTX's "streamer" WHIP publish user.
      # Grants access to the /dock OBS HUD.
      STREAMER_PASSWORD: ${STREAMER_PASSWORD:-}
      # Discord OAuth app credentials (https://discord.com/developers/applications)
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      # Set to "true" to show the "Sign in with Discord" button on the login page
      NEXT_PUBLIC_DISCORD_ENABLED: ${NEXT_PUBLIC_DISCORD_ENABLED:-false}
      # Set to "true" to disable authentication on /dock and /stream (useful when behind reverse proxy with local-only access)
      DISABLE_DOCK_AUTH: ${DISABLE_DOCK_AUTH:-false}

    volumes:
      - ./auth:/auth:ro # read viewer-token written by stream-online.sh
      - ./config:/data/sqlite # persists the SQLite database (saved /stream settings)

    ports:
      - "${NEXTJS_PORT:-8080}:3000"

    depends_on:
      - discordmtx

    networks:
      - stream

networks:
  stream:
